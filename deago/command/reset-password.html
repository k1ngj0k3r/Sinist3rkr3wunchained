<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D.E.A.G.O. Password Setup</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: #090b10;
  color: #f4f4f5;
  font-family: Arial, sans-serif;
  display: grid;
  place-items: center;
  padding: 20px;
}
.command {
  width: 100%;
  max-width: 420px;
  background: #151923;
  border: 1px solid #343b49;
  border-radius: 16px;
  padding: 28px;
}
h1 { color: #ef4444; text-align: center; }
input, button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border-radius: 8px;
  font-size: 16px;
}
input {
  background: #090b10;
  border: 1px solid #475569;
  color: white;
}
button {
  background: #b91c1c;
  border: 0;
  color: white;
  font-weight: bold;
}
button:disabled { opacity: .5; }
#message {
  color: #a1a1aa;
  text-align: center;
  line-height: 1.5;
}
a { color: #f87171; }
</style>
</head>
<body>
<main class="command">
<h1>🛡️ D.E.A.G.O.</h1>
<p style="text-align:center">Leadership Password Setup</p>

<form id="reset" hidden>
  <label for="password">New Password</label>
  <input id="password" type="password"
    autocomplete="new-password" minlength="12" required>

  <label for="confirm">Confirm Password</label>
  <input id="confirm" type="password"
    autocomplete="new-password" minlength="12" required>

  <button type="submit">SET PASSWORD</button>
</form>

<p id="message" role="status">Verifying recovery link...</p>
<p style="text-align:center">
<a href="./">Return to Command Login</a>
</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="./config.js"></script>
<script>
"use strict";

const message = document.getElementById("message");
const form = document.getElementById("reset");

(async () => {
  const config = window.DEAGO_CONFIG;

  if (!config || !window.supabase) {
    message.textContent = "Authentication unavailable.";
    return;
  }

  const client = window.supabase.createClient(
    config.supabaseUrl,
    config.supabaseKey,
    { auth: { detectSessionInUrl: true } }
  );

  const params = new URLSearchParams(location.search);
  const code = params.get("code");
  const tokenHash = params.get("token_hash");
  const type = params.get("type");
  const hash = new URLSearchParams(location.hash.slice(1));

  const recoveryLink =
    type === "recovery" ||
    hash.get("type") === "recovery";

  try {
    if (code) {
      const { error } = await client.auth.exchangeCodeForSession(code);
      if (error) throw error;
    } else if (tokenHash && type === "recovery") {
      const { error } = await client.auth.verifyOtp({
        token_hash: tokenHash,
        type: "recovery"
      });
      if (error) throw error;
    }

    const { data: { session }, error } =
      await client.auth.getSession();

    if (error || !session || !recoveryLink) {
      message.textContent =
        "Invalid or expired recovery link. Request a new password recovery email.";
      return;
    }

    const { data: leadership, error: roleError } =
      await client.from("deago_leadership")
        .select("role")
        .eq("user_id", session.user.id)
        .single();

    if (roleError || !leadership ||
        !["founder", "administrator"].includes(leadership.role)) {
      await client.auth.signOut();
      message.textContent = "Leadership authorization required.";
      return;
    }

    history.replaceState(null, "", location.pathname);
    form.hidden = false;
    message.textContent = "Choose your new password.";

    form.addEventListener("submit", async event => {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;

      if (password !== confirm) {
        message.textContent = "Passwords do not match.";
        return;
      }

      const button = form.querySelector("button");
      button.disabled = true;
      message.textContent = "Saving password...";

      const { error } = await client.auth.updateUser({ password });

      if (error) {
        message.textContent = error.message;
        button.disabled = false;
        return;
      }

      await client.auth.signOut();
      form.hidden = true;
      message.textContent =
        "Password saved. Return to Command Login to sign in.";
    });
  } catch (error) {
    message.textContent =
      "Recovery link could not be verified. Request a new link.";
  }
})();
</script>
</body>
</html>
